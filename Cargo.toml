[workspace]
resolver = "2"
members = [
    "crates/droidpath-core",
    "crates/droidpath-mcp",
    "apps/droidpath-desktop/src-tauri",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/V0val0x/DroidPath"
authors = ["Kirill Zaitsev"]

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
fancy-regex = "0.14"
flate2 = "1"
futures-util = "0.3"
quick-xml = "0.37"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "fs", "time", "sync", "process", "macros", "signal"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
