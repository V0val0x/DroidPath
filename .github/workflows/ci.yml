name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: swift test

  test-kotlin-daemon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Kotlin unit tests & verify DEX jar
        run: |
          chmod +x android-daemon/gradlew android-daemon/scripts/*.sh
          ./android-daemon/gradlew -p android-daemon test build
