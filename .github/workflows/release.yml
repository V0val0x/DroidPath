name: Release DroidPath

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build single-DEX android-daemon.jar
        run: |
          chmod +x android-daemon/gradlew android-daemon/scripts/*.sh
          ./android-daemon/scripts/build-dex.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-daemon
          path: android-daemon/build/dist/android-daemon.jar

  build-mcp-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: droidpath-mcp-aarch64-apple-darwin
            bin: droidpath-mcp
          - os: macos-15
            target: x86_64-apple-darwin
            asset: droidpath-mcp-x86_64-apple-darwin
            bin: droidpath-mcp
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: droidpath-mcp-x86_64-unknown-linux-gnu
            bin: droidpath-mcp
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: droidpath-mcp-aarch64-unknown-linux-gnu
            bin: droidpath-mcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: droidpath-mcp-x86_64-pc-windows-msvc.exe
            bin: droidpath-mcp.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: droidpath-mcp-aarch64-pc-windows-msvc.exe
            bin: droidpath-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release droidpath-mcp
        run: cargo build --release -p droidpath-mcp --target ${{ matrix.target }}
      - name: Stage binary artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-${{ matrix.target }}
          path: dist/${{ matrix.asset }}

  build-desktop-hud:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build Tauri v2 Desktop HUD bundle
        working-directory: apps/droidpath-desktop
        run: npm install && npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    needs: [build-daemon, build-mcp-binaries, build-desktop-hud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Flatten nested bundle artifacts and include installer scripts
        run: |
          find release-artifacts -mindepth 2 -type f -exec mv -n {} release-artifacts/ \;
          find release-artifacts -mindepth 1 -type d -empty -delete
          cp scripts/install.sh release-artifacts/install.sh
          cp scripts/install.ps1 release-artifacts/install.ps1
          echo "=== Staged GitHub Release assets ==="
          ls -lh release-artifacts/
          for ext in dmg deb msi; do
            if ! compgen -G "release-artifacts/*.$ext" > /dev/null; then
              echo "ERROR: Missing expected Desktop HUD release bundle (*.$ext) in release-artifacts/" >&2
              exit 1
            fi
          done
      - name: Generate and verify SHA-256 checksums.txt
        run: |
          cd release-artifacts
          rm -f checksums.txt
          while IFS= read -r file; do
            sha256sum -- "$file" >> checksums.txt
          done < <(LC_ALL=C find . -maxdepth 1 -type f ! -name 'checksums.txt' -printf '%f\n' | LC_ALL=C sort)
          echo "=== SHA-256 checksums.txt ==="
          cat checksums.txt
          sha256sum -c checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
